services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data:/data
      - ./config:/config
    networks:
      - web
    depends_on:
      - onlyoffice
      - collabora

  onlyoffice-db:
    image: postgres:15-alpine
    container_name: onlyoffice-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=onlyoffice
      - POSTGRES_USER=onlyoffice
      - POSTGRES_PASSWORD=${POSTGRES_DB_PASSWORD}
    volumes:
      - ./onlyoffice_postgresql:/var/lib/postgresql/data
    networks:
      - web

  onlyoffice-rabbitmq:
    image: rabbitmq:3-alpine
    container_name: onlyoffice-rabbitmq
    restart: unless-stopped
    networks:
      - web

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice
    restart: unless-stopped
    depends_on:
      - onlyoffice-db
      - onlyoffice-rabbitmq
    environment:
      - DB_TYPE=postgres
      - DB_HOST=onlyoffice-db
      - DB_PORT=5432
      - DB_NAME=onlyoffice
      - DB_USER=onlyoffice
      - DB_PWD=${POSTGRES_DB_PASSWORD}
      - AMQP_URI=amqp://guest:guest@onlyoffice-rabbitmq:5672
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET}
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=true
    volumes:
      - ./onlyoffice_data:/var/www/onlyoffice/Data
      - ./onlyoffice_log:/var/log/onlyoffice
    networks:
      - web

  collabora:
    image: collabora/code:latest
    container_name: collabora
    restart: unless-stopped
    environment:
      # Public FQDN of Collabora (without protocol)
      - server_name=collabora.iosifidis.gr

      # Multi-instance Nextcloud configuration (Option A: separate aliasgroups)
      - aliasgroup1=${NEXTCLOUD_DOMAIN_1}
      - aliasgroup2=${NEXTCLOUD_DOMAIN_2}

      # Option B (Alternative: regex pattern without spaces):
      # - aliasgroup1=https://nextcloud(1|2)\.iosifidis\.gr:443

      - extra_params=--o:ssl.enable=false --o:ssl.termination=true
      - DONT_GEN_SSL_CERT=true
    volumes:
      - ./collabora:/opt/cool/data
    networks:
      - web
    cap_add:
      - MKNOD

networks:
  web:
    driver: bridge
