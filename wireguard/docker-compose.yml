services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Athens
      - SERVERURL=vpndomain.duckdns.org # Αντικαταστήστε με το δικό σας DuckDNS / DDNS domain
      - SERVERPORT=51820
      - PEERS=phone,laptop,tablet # Ονόματα ή αριθμός peers/συσκευών
      - PEERDNS=auto # ή η IP του AdGuard Home (π.χ. 192.168.1.XX) για ad-blocking
      - INTERNAL_SUBNET=10.13.13.0/24
      - ALLOWEDIPS=0.0.0.0/0, ::/0 # Full tunnel: Όλη η κίνηση (Internet + Home LAN) μέσω του VPN
      - PERSISTENTKEEPALIVE_PEERS=25
      - LOG_CONFS=true
    volumes:
      - ./config:/config
      - /lib/modules:/lib/modules
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped
